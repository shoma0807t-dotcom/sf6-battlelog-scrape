name: Scrape SF6 battlelog

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        env:
          CAPCOM_ID_EMAIL: ${{ secrets.CAPCOM_ID_EMAIL }}
          CAPCOM_ID_PASSWORD: ${{ secrets.CAPCOM_ID_PASSWORD }}
          SF6_SESSION_COOKIE: ${{ secrets.SF6_SESSION_COOKIE }}
          SF6_FIGHTER_ID: ${{ secrets.SF6_FIGHTER_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: node scrape.js

      - name: Show debug files
        if: always()
        run: |
          echo "=== output directory ==="
          ls -la output 2>/dev/null || echo "output does not exist"
          echo "=== all files ==="
          find . -maxdepth 4 -type f -print

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: output/
          if-no-files-found: warn
