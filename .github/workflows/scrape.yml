name: Scrape SF6 battlelog

on:
  workflow_dispatch: {}
  schedule:
    # 毎日 21:00 JST（12:00 UTC）
    - cron: "0 12 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install

      # Chrome / ChromeDriverのセットアップは不要
      # Bright Data Scraping Browserへリモート接続する

      - name: Run scraper
        env:
          SF6_SESSION_COOKIE: ${{ secrets.SF6_SESSION_COOKIE }}
          CAPCOM_ID_EMAIL: ${{ secrets.CAPCOM_ID_EMAIL }}
          CAPCOM_ID_PASSWORD: ${{ secrets.CAPCOM_ID_PASSWORD }}
          SF6_FIGHTER_ID: ${{ secrets.SF6_FIGHTER_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}

          # Bright Data Scraping Browser
          BRIGHT_DATA_SCRAPING_BROWSER_URL: ${{ secrets.BRIGHT_DATA_SCRAPING_BROWSER_URL }}

        run: node scrape.js

      - name: Upload debug artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            output/debug-*.html
            output/debug-*.png
            output/debug-*.txt
          if-no-files-found: ignore
